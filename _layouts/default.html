---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js" data-theme-mode="auto">
  <head>
    <script>try{const mode=localStorage.getItem('themeMode')||'auto';const hour=new Date().getHours();const theme=mode==='auto'?(hour>=7&&hour<19?'light':'dark'):mode;document.documentElement.dataset.themeMode=mode;document.documentElement.dataset.theme=theme;}catch(error){const hour=new Date().getHours();document.documentElement.dataset.theme=hour>=7&&hour<19?'light':'dark';}</script>
    {% include head.html %}
    {% include head/custom.html %}
  </head>
  <body{% if page.classes %} class="{{ page.classes }}"{% endif %}>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="reading-progress" aria-hidden="true"><span></span></div>
    {% include browser-upgrade.html %}
    {% include masthead.html %}
    {{ content }}
    <div class="page__footer"><footer>{% include footer.html %}</footer></div>
    <button class="back-to-top" type="button" aria-label="Back to top"><i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button>
    {% include scripts.html %}
  </body>
</html>
